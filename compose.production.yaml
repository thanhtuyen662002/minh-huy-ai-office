services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: minh-huy-ai-office/web:${AIOFFICE_RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AIOFFICE_LOCAL_CORE_API_URL: http://core-api:8080
      AIOFFICE_LOCAL_UI_ENABLED: "false"
    ports:
      - "127.0.0.1:${AIOFFICE_WEB_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - ai-office

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in ignored .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in ignored .env.production}

  core-api:
    build:
      context: .
      dockerfile: src/Core.Api/Dockerfile
    image: minh-huy-ai-office/core-api:${AIOFFICE_RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AIOffice__PlatformDatabase__ConnectionSecretRef: secretref://env/AIOFFICE_DB_CONNECTION
      AIOffice__Authentication__Authority: ${AIOFFICE_AUTHORITY:?set AIOFFICE_AUTHORITY from the approved identity provider}
      AIOffice__Authentication__Audience: ${AIOFFICE_AUDIENCE:?set AIOFFICE_AUDIENCE from the approved identity provider}
      AIOFFICE_DB_CONNECTION: ${AIOFFICE_DB_CONNECTION:?set AIOFFICE_DB_CONNECTION from the approved runtime secret source}
      PILOT_ERP_CONNECTION: ${PILOT_ERP_CONNECTION:?set PILOT_ERP_CONNECTION from the approved pilot secret source}
      RabbitMqWork__HostName: rabbitmq
      RabbitMqWork__Port: 5672
      RabbitMqWork__UserName: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in ignored .env.production}
      RabbitMqWork__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in ignored .env.production}
      RabbitMqWork__QueueName: minhhuy.work.v1
      RabbitMqWork__PrefetchCount: 8
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8080}:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - ai-office

  agent-worker:
    build:
      context: .
      dockerfile: src/Agent.Worker/Dockerfile
    image: minh-huy-ai-office/agent-worker:${AIOFFICE_RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      DOTNET_ENVIRONMENT: Production
      AIOFFICE_DB_CONNECTION: ${AIOFFICE_DB_CONNECTION:?set AIOFFICE_DB_CONNECTION from the approved runtime secret source}
      PILOT_ERP_CONNECTION: ${PILOT_ERP_CONNECTION:?set PILOT_ERP_CONNECTION from the approved pilot secret source}
      AIOFFICE_AI_PRIMARY_BASE_URL: ${AIOFFICE_AI_PRIMARY_BASE_URL:-}
      AIOFFICE_AI_PRIMARY_MODEL: ${AIOFFICE_AI_PRIMARY_MODEL:-}
      AIOFFICE_AI_PRIMARY_AUTHORIZATION: ${AIOFFICE_AI_PRIMARY_AUTHORIZATION:-}
      AIOFFICE_AI_PRIMARY_PROVIDER_ID: ${AIOFFICE_AI_PRIMARY_PROVIDER_ID:-openai-direct}
      AIOFFICE_AI_BACKUP_BASE_URL: ${AIOFFICE_AI_BACKUP_BASE_URL:-}
      AIOFFICE_AI_BACKUP_MODEL: ${AIOFFICE_AI_BACKUP_MODEL:-}
      AIOFFICE_AI_BACKUP_AUTHORIZATION: ${AIOFFICE_AI_BACKUP_AUTHORIZATION:-}
      AIOFFICE_AI_BACKUP_PROVIDER_ID: ${AIOFFICE_AI_BACKUP_PROVIDER_ID:-external-backup}
      # Backward-compatible single-provider aliases. Explicit PRIMARY_* values take precedence.
      AIOFFICE_AI_BASE_URL: ${AIOFFICE_AI_BASE_URL:-}
      AIOFFICE_AI_MODEL: ${AIOFFICE_AI_MODEL:-}
      AIOFFICE_AI_AUTHORIZATION: ${AIOFFICE_AI_AUTHORIZATION:-}
      AIOFFICE_AI_PROVIDER_ID: ${AIOFFICE_AI_PROVIDER_ID:-openai-compatible}
      RabbitMqWork__HostName: rabbitmq
      RabbitMqWork__Port: 5672
      RabbitMqWork__UserName: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in ignored .env.production}
      RabbitMqWork__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in ignored .env.production}
      RabbitMqWork__QueueName: minhhuy.work.v1
      RabbitMqWork__PrefetchCount: 8
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    networks:
      - ai-office
