# Single Windows host overlay (IIS in front, Docker Desktop behind).
# Use together with compose.yaml + compose.production.yaml; see docs/DEPLOYMENT_WINDOWS_VPS.md.
#
# - session-redis: private TLS Redis for browser sessions. The base plaintext
#   Redis is never browser session authority.
# - extra_hosts: the public HTTPS names resolve to this host so server-side calls
#   (token exchange, JWKS, Core origin) reach IIS directly instead of relying on
#   router NAT hairpinning. TLS is still validated against the IIS certificate.
# - cpus: one shared VM also runs Windows, IIS, Keycloak and the bots. Each service is
#   capped so no single container (or a busy RabbitMQ scheduler) can take every core.
services:
  session-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      # Password is read from a mounted file, never redis-server's process argv.
      # Compose mounts a file secret at /run/secrets/<secret name>.
      - /run/secrets/session_redis_config
    secrets:
      - session_redis_config
    volumes:
      - ${AIOFFICE_VPS_TLS_DIR:?set AIOFFICE_VPS_TLS_DIR to the session Redis TLS folder}:/tls:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - ai-office
    cpus: 0.5

  web:
    cpus: 1
    environment:
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
    volumes:
      - ${AIOFFICE_VPS_TLS_DIR}/ca.crt:/tls/ca.crt:ro
    extra_hosts: &public-names
      - "${AIOFFICE_VPS_WEB_HOST:?set AIOFFICE_VPS_WEB_HOST}:host-gateway"
      - "${AIOFFICE_VPS_IDENTITY_HOST:?set AIOFFICE_VPS_IDENTITY_HOST}:host-gateway"
      - "${AIOFFICE_VPS_API_HOST:?set AIOFFICE_VPS_API_HOST}:host-gateway"
    depends_on:
      session-redis:
        condition: service_started

  # Single shared host: a busy CPU (image builds, Windows Update) can delay the probe
  # past 5s. Allow longer before RabbitMQ counts as unhealthy and blocks a deploy.
  rabbitmq:
    healthcheck:
      timeout: 20s
    cpus: 1
    environment:
      # Erlang schedulers busy-wait by default, burning idle CPU on a shared VM.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"

  redis:
    cpus: 0.5

  otel-collector:
    cpus: 0.5

  jaeger:
    cpus: 0.5

  core-api:
    cpus: 2
    extra_hosts: *public-names
    # Optional protected file of extra Core.Api settings that do not fit fixed Compose keys,
    # e.g. AIOffice__CustomerRequests__Services__<n>__... (any number of bot services/groups)
    # and their AIOFFICE_CUSTOMER_REQUEST_HMAC key. Absent file = feature stays off.
    env_file:
      - path: ${AIOFFICE_VPS_CORE_API_ENV_FILE:-.core-api.env}
        required: false

  agent-worker:
    cpus: 1
    extra_hosts: *public-names

secrets:
  session_redis_config:
    file: ${AIOFFICE_VPS_REDIS_CONFIG_FILE:?set protected session Redis configuration file path}
