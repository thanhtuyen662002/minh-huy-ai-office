name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET format, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MinhHuy.AIOffice.sln
      - name: Verify all test projects are in the solution
        shell: bash
        run: |
          set -euo pipefail
          listed_projects="$(dotnet sln MinhHuy.AIOffice.sln list | tr '\\' '/')"
          while IFS= read -r project; do
            if ! grep -Fqx "${project}" <<< "${listed_projects}"; then
              echo "::error file=${project}::Test project is not included in MinhHuy.AIOffice.sln"
              exit 1
            fi
          done < <(find tests -name '*.csproj' -print | sort)
      - name: Verify formatting
        run: dotnet format MinhHuy.AIOffice.sln --no-restore --verify-no-changes --verbosity normal
      - name: Build
        run: dotnet build MinhHuy.AIOffice.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MinhHuy.AIOffice.sln --configuration Release --no-build --no-restore --logger "console;verbosity=normal"

  web:
    name: Web tests, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/configure-docker-cache
        with:
          profile: web
      - name: Start owned disposable session Redis
        id: session_redis
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --name aioffice-ci-session-redis \
            --publish 127.0.0.1:6379:6379 redis:8-alpine)"
          [[ "$container_id" =~ ^[a-f0-9]{64}$ ]]
          echo "container_id=${container_id}" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        env:
          AIOFFICE_TEST_SESSION_REDIS_URL: redis://127.0.0.1:6379
          AIOFFICE_TEST_SESSION_REDIS_CONTAINER: ${{ steps.session_redis.outputs.container_id }}
          AIOFFICE_TEST_SESSION_REDIS_DISPOSABLE: 'true'
        run: npm run web:test
      - name: Type-check
        run: npm run web:typecheck
      - name: Build
        run: npm run web:build
      - name: Remove only owned disposable session Redis
        if: always()
        shell: bash
        env:
          AIOFFICE_CI_REDIS_ID: ${{ steps.session_redis.outputs.container_id }}
        run: |
          if [[ "$AIOFFICE_CI_REDIS_ID" =~ ^[a-f0-9]{64}$ ]]; then
            docker container rm --force "$AIOFFICE_CI_REDIS_ID"
          fi

  web-runtime:
    name: FE container runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/configure-docker-cache
        with:
          profile: web-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build standalone FE image
        run: docker build --file apps/web/Dockerfile --tag aioffice/web:ci .
      - name: Verify the running FE and its runtime configuration
        run: node scripts/smoke-web-container.mjs aioffice/web:ci

  local-runtime:
    name: Complete local stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/configure-docker-cache
        with:
          profile: local-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser proof dependencies
        run: npm ci --no-audit --no-fund
      - name: Install required Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Verify adversarial fixture execution boundary
        run: |
          python scripts/test-owned-stack-guard.py
          node --test scripts/test-browser-administrators-guard.mjs
      - name: Verify private configuration replay and browser key
        shell: pwsh
        run: ./scripts/test-local-config.ps1
      - name: Generate protected local installation configuration
        shell: pwsh
        run: ./infra/initialize-local-config.ps1 -DataDirectory (Join-Path $env:RUNNER_TEMP 'aioffice-local')
      - name: Validate local configuration
        run: docker compose --env-file "$RUNNER_TEMP/aioffice-local/local.env" -f compose.local.yaml config --quiet
      - name: Verify real SQL, OIDC, broker, API, worker and FE
        run: python scripts/smoke-local-stack.py "$RUNNER_TEMP/aioffice-local"
      - name: Verify actual Chromium browser OIDC and private UI lifecycle
        run: node scripts/smoke-browser-oidc.mjs "$RUNNER_TEMP/aioffice-local"
      - name: Retain sanitized disposable workspace screenshot
        uses: actions/upload-artifact@v4
        with:
          name: browser-workspace-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/aioffice-browser-proof/workspace.png
            ${{ runner.temp }}/aioffice-browser-proof/administrators.png
            ${{ runner.temp }}/aioffice-browser-proof/task-history.png
            ${{ runner.temp }}/aioffice-browser-proof/task-submission.png
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this ephemeral CI stack
        if: ${{ always() }}
        run: docker compose --env-file "$RUNNER_TEMP/aioffice-local/local.env" -f compose.local.yaml down --volumes --remove-orphans

  infrastructure:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

  deployment:
    name: Deployment contract and container builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/configure-docker-cache
        with:
          profile: deployment
      - name: Validate production deployment contract
        shell: bash
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/deployment-compose.json"
          docker compose \
            --env-file .env.production.example \
            -f compose.yaml \
            -f compose.production.yaml \
            config --format json > "${rendered}"
          python3 scripts/validate-deployment.py "${rendered}"
          python3 -m unittest discover -s scripts -p test_browser_deployment.py
          python3 -m json.tool apps/web/vercel.json >/dev/null
      - name: Validate enabled production browser deployment contract
        env:
          AIOFFICE_BROWSER_OIDC_ENABLED: "true"
          AIOFFICE_BROWSER_OIDC_PUBLIC_ORIGIN: https://office.example.test
          AIOFFICE_BROWSER_OIDC_AUTHORIZATION_ENDPOINT: https://identity.example.test/authorize
          AIOFFICE_BROWSER_OIDC_TOKEN_ENDPOINT: https://identity.example.test/token
          AIOFFICE_BROWSER_OIDC_JWKS_URI: https://identity.example.test/certs
          AIOFFICE_BROWSER_OIDC_CLIENT_ID: office-browser
          AIOFFICE_BROWSER_OIDC_TRANSACTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          AIOFFICE_BROWSER_CORE_API_ORIGIN: https://api.example.test
          AIOFFICE_BROWSER_SESSION_REDIS_URL: rediss://private-cache.example.test:6380/1
        run: |
          set -euo pipefail
          rendered="${RUNNER_TEMP}/browser-deployment-compose.json"
          docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --format json > "${rendered}"
          python3 scripts/validate-deployment.py "${rendered}"
      - name: Build Core.Api container
        run: docker build --file src/Core.Api/Dockerfile --tag aioffice/core-api:ci .
      - name: Build Agent.Worker container
        run: docker build --file src/Agent.Worker/Dockerfile --tag aioffice/agent-worker:ci .
      - name: Verify application containers run as non-root
        shell: bash
        run: |
          set -euo pipefail
          for image in aioffice/core-api:ci aioffice/agent-worker:ci; do
            configured_user="$(docker image inspect --format '{{.Config.User}}' "${image}")"
            if [ -z "${configured_user}" ] || [ "${configured_user}" = "0" ] || [ "${configured_user}" = "root" ]; then
              echo "::error::${image} does not declare a non-root runtime user"
              exit 1
            fi

            runtime_uid="$(docker run --rm --entrypoint sh "${image}" -c 'id -u')"
            if [ -z "${runtime_uid}" ] || [ "${runtime_uid}" = "0" ]; then
              echo "::error::${image} executes as root (uid=${runtime_uid:-unknown})"
              exit 1
            fi

            echo "${image} runtime user=${configured_user} uid=${runtime_uid}"
          done
      - name: Verify application runtime framework closure
        shell: bash
        run: |
          set -euo pipefail

          verify_runtime() {
            local image="$1"
            local app="$2"
            local runtimeconfig="/app/${app}.runtimeconfig.json"
            local config
            local installed

            config="$(docker run --rm --entrypoint cat "${image}" "${runtimeconfig}")"
            installed="$(docker run --rm --entrypoint dotnet "${image}" --list-runtimes)"

            while IFS= read -r framework; do
              [ -n "${framework}" ] || continue
              if ! grep -Fq "${framework} " <<< "${installed}"; then
                echo "::error::${image} is missing required shared framework ${framework}"
                exit 1
              fi
              echo "${image} provides required shared framework ${framework}"
            done < <(
              python3 -c 'import json,sys; opts=json.load(sys.stdin).get("runtimeOptions",{}); frameworks=opts.get("frameworks"); frameworks=frameworks if frameworks is not None else ([opts.get("framework")] if opts.get("framework") else []); [print(f["name"]) for f in frameworks if f and f.get("name")]' <<< "${config}"
            )
          }

          verify_runtime aioffice/core-api:ci MinhHuy.AIOffice.Core.Api
          verify_runtime aioffice/agent-worker:ci MinhHuy.AIOffice.Agent.Worker

  migrations:
    name: EF Core migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIOFFICE_DB_CONNECTION: "Server=127.0.0.1,1433;Database=AIOfficeCiValidation;Integrated Security=true;TrustServerCertificate=true;Connect Timeout=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MinhHuy.AIOffice.sln
      - name: Restore local .NET tools
        run: dotnet tool restore
      - name: Build persistence project
        run: dotnet build src/Platform.Persistence/Platform.Persistence.csproj --configuration Release --no-restore
      - name: Generate idempotent migration script
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/aioffice-migrations.sql"
          dotnet ef migrations script 0 \
            --project src/Platform.Persistence/Platform.Persistence.csproj \
            --configuration Release \
            --no-build \
            --idempotent \
            --output "${output}"
          test -s "${output}"
          grep -q "__EFMigrationsHistory" "${output}"
          grep -q "20260919114500_InitialPlatformFoundation" "${output}"

  quality-gates:
    name: Required quality gates
    if: ${{ always() }}
    needs: [dotnet, web, web-runtime, local-runtime, infrastructure, deployment, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required gate results
        env:
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WEB_RUNTIME_RESULT: ${{ needs['web-runtime'].result }}
          LOCAL_RUNTIME_RESULT: ${{ needs['local-runtime'].result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          MIGRATIONS_RESULT: ${{ needs.migrations.result }}
        run: |
          set -euo pipefail
          failed=0
          for gate in DOTNET_RESULT WEB_RESULT WEB_RUNTIME_RESULT LOCAL_RUNTIME_RESULT INFRASTRUCTURE_RESULT DEPLOYMENT_RESULT MIGRATIONS_RESULT; do
            result="${!gate}"
            echo "${gate}=${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
