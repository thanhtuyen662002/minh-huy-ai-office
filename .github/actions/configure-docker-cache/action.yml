name: Configure hosted Docker Hub cache
description: Use the Google-managed cache on an empty disposable hosted Linux daemon.
inputs:
  profile:
    description: Fixed repository image profile for the calling job.
    required: true
runs:
  using: composite
  steps:
    - name: Verify cache configuration guard
      shell: bash
      run: python3 scripts/test-ci-docker-cache.py
    - name: Configure hosted daemon cache
      shell: bash
      env:
        AIOFFICE_DOCKER_CACHE_RUNNER: ${{ runner.environment }}
        AIOFFICE_DOCKER_CACHE_PROFILE: ${{ inputs.profile }}
      run: |
        sudo --preserve-env=CI,GITHUB_ACTIONS,RUNNER_OS,AIOFFICE_DOCKER_CACHE_RUNNER,AIOFFICE_DOCKER_CACHE_PROFILE \
          python3 scripts/configure-ci-docker-cache.py
