passwordResetSubject=AI Office - Đặt lại mật khẩu
passwordResetBody=Có người vừa yêu cầu đặt lại mật khẩu tài khoản AI Office của bạn. Nếu đúng là bạn, hãy mở liên kết dưới đây để đặt mật khẩu mới.\n\n{0}\n\nLiên kết có hiệu lực trong {3}.\n\nNếu bạn không yêu cầu, hãy bỏ qua email này. Mật khẩu hiện tại vẫn giữ nguyên.
passwordResetBodyHtml=<p>Có người vừa yêu cầu đặt lại mật khẩu tài khoản AI Office của bạn. Nếu đúng là bạn, hãy bấm vào liên kết dưới đây để đặt mật khẩu mới.</p><p><a href="{0}">Đặt lại mật khẩu</a></p><p>Liên kết có hiệu lực trong {3}.</p><p>Nếu bạn không yêu cầu, hãy bỏ qua email này. Mật khẩu hiện tại vẫn giữ nguyên.</p>
executeActionsSubject=AI Office - Đặt mật khẩu cho tài khoản của bạn
executeActionsBody=Bạn đã có tài khoản AI Office (Minh Huy). Mở liên kết dưới đây để: {3}. Xong là đăng nhập được ngay.\n\n{0}\n\nLiên kết có hiệu lực trong {4}. Hết hạn thì nhờ quản trị viên gửi lại, hoặc bấm "Quên mật khẩu?" ở trang đăng nhập.\n\nNếu bạn không biết về việc này, hãy bỏ qua email.
executeActionsBodyHtml=<p>Bạn đã có tài khoản AI Office (Minh Huy). Bấm vào liên kết dưới đây để: {3}. Xong là đăng nhập được ngay.</p><p><a href="{0}">Đặt mật khẩu</a></p><p>Liên kết có hiệu lực trong {4}. Hết hạn thì nhờ quản trị viên gửi lại, hoặc bấm "Quên mật khẩu?" ở trang đăng nhập.</p><p>Nếu bạn không biết về việc này, hãy bỏ qua email.</p>
